<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS Simulator</title>
    <link rel="stylesheet" href="styles.css?v=20260503c" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import("./main.js?v=20260503c").catch((error) => {
        const pre = document.createElement("pre");
        pre.id = "boot-error";
        pre.textContent = error?.stack || error?.message || String(error);
        document.body.appendChild(pre);
      });
    </script>
  </body>
  </html>
